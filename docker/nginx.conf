# Nginx configuration for AI SEO Automation Platform
# Serves the React SPA at / and proxies /api/* to the Node.js backend

upstream api_servers {
    server api:3000;
    keepalive 32;
}

# ─── HTTP Server (Development / Production) ──
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── API Proxy ───────────────────────────────
    # All /api/* requests go to the Node.js backend
    location /api/ {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # ─── Health Check (no auth required) ─────────
    location /health {
        proxy_pass http://api_servers/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ─── Static Assets (with caching) ────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Favicon ─────────────────────────────────
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── SPA Fallback ────────────────────────────
    # All other routes serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

