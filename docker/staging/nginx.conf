upstream api_servers {
    server api:3000;
}

server {
    listen 80;
    server_name staging.tdsgeo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.tdsgeo.com;

    ssl_certificate /etc/letsencrypt/live/staging.tdsgeo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.tdsgeo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/staging-access.log;
    error_log /var/log/nginx/staging-error.log;

    client_max_body_size 50M;

    # Health endpoint (no auth)
    location /health {
        proxy_pass http://api_servers/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limit headers
        add_header X-RateLimit-Limit 100 always;
        add_header X-RateLimit-Remaining 95 always;
    }

    # SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Security headers
    add_header Content-Security-Policy "frame-ancestors 'self' https://admin.shopify.com https://*.myshopify.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Staging badge
    add_header X-Environment "staging" always;
}
