services:
  api:
    image: ghcr.io/tds-geo/ai-seo-automation:staging
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-staging.rule=Host(`api-staging.tdsgeo.com`)"

  worker:
    image: ghcr.io/tds-geo/ai-seo-automation:staging
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G

  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - postgres-data-staging:/var/lib/postgresql/data

  redis:
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    environment:
      NGINX_HOST: staging.tdsgeo.com
    volumes:
      - ./docker/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data-staging:
