services:
  api:
    image: ghcr.io/tds-geo/ai-seo-automation:production
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.tdsgeo.com`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  worker:
    image: ghcr.io/tds-geo/ai-seo-automation:production
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: always

  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    backup:
      enabled: true
      schedule: "0 3 * * *"

  redis:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  nginx:
    environment:
      NGINX_HOST: app.tdsgeo.com
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

  prometheus:
    image: prom/prometheus:v2.52
    ports:
      - "9090:9090"
    volumes:
      - ./docker/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/production/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: always

  grafana:
    image: grafana/grafana:11.1
    ports:
      - "3001:3000"
    volumes:
      - ./docker/production/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
      - ./docker/production/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/tdsgeo.json:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/tdsgeo.json
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.8
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    restart: always

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/ai_seo_automation?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    ports:
      - "9113:9113"
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx_status"
    depends_on:
      - nginx
    restart: always

volumes:
  postgres-data-prod:
  prometheus-data:
  grafana-data:
