# ──────────────────────────────────────────────────────────
# TDS Geo — Docker Container Log Rotation
# Place at: /etc/logrotate.d/tdsgeo
# ──────────────────────────────────────────────────────────

/var/lib/docker/containers/*/*.log {
  rotate 7
  daily
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  maxsize 100M
}

# Application logs (mounted volumes)
/opt/tds-geo/logs/*.log {
  rotate 30
  daily
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  maxsize 50M
  maxage 30
}

# Nginx access/error logs
/opt/tds-geo/logs/nginx/*.log {
  rotate 14
  daily
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  maxsize 200M
  postrotate
    docker exec tds-geo-nginx nginx -s reopen 2>/dev/null || true
  endscript
}
