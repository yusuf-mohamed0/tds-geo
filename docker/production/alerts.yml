groups:
  - name: tdsgeo
    interval: 30s

    # ─── API Health ────────────────────────────────
    - alert: API_Down
      expr: probe_success{job="api"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "API is down"
        description: "API has been unreachable for 1 minute."

    - alert: API_HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "API error rate > 5%"
        description: "API 5xx rate is {{ humanize $value }} over 5m."

    - alert: API_HighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "API p95 latency > 2s"
        description: "API p95 latency is {{ humanize $value }}s over 5m."

    # ─── Database ────────────────────────────────
    - alert: PostgreSQL_Down
      expr: pg_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL is down"
        description: "Database has been unreachable for 1 minute."

    - alert: PostgreSQL_HighConnections
      expr: pg_stat_activity_count > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL connections > 80"
        description: "Active connections: {{ humanize $value }}"

    # ─── Redis ──────────────────────────────────
    - alert: Redis_Down
      expr: redis_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Redis is down"
        description: "Redis has been unreachable for 1 minute."

    # ─── System ────────────────────────────────
    - alert: DiskSpaceLow
      expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Disk space < 10%"
        description: "Only {{ humanize $value }}% disk space remaining."

    - alert: MemoryLow
      expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Memory < 10% available"
        description: "Only {{ humanize $value }}% memory available."

    - alert: HighCPU
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "CPU > 90%"
        description: "CPU usage is {{ humanize $value }}% over 10m."

    # ─── Docker ────────────────────────────────
    - alert: ContainerRestarting
      expr: time() - container_last_seen > 60
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.name }} not seen"
        description: "Container {{ $labels.name }} has not reported for 5 minutes."
