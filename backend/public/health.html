<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kivo Pulse — System Health</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --obsidian:#071013; --gold:#22E6A8; --cream:#F4FBF8; --graphite:#25343A; --muted:#6D7E86; --navy:#0B1F3A; --sky:#3BB5FF; --amber:#B7FF4A; --border:#D9E8E2; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(circle at top left, rgba(252,185,0,.16), transparent 36%), linear-gradient(135deg, var(--obsidian), var(--navy)); color: var(--cream); padding: 2rem; min-height: 100vh; }
  h1 { color: var(--gold); margin-bottom: .5rem; }
  .subtitle { color: var(--border); margin-bottom: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .card { background: rgba(23,20,20,.74); padding: 1.25rem; border: 1px solid rgba(230,221,214,.18); box-shadow: 0 16px 50px rgba(0,0,0,.18); }
  .card h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .5rem; }
  .card .value { font-size: 1.5rem; font-weight: 700; }
  .card .status { display: inline-block; padding: .2rem .6rem; font-size: .75rem; font-weight: 600; }
  .status-ok { background: #065f46; color: #6ee7b7; }
  .status-warn { background: rgba(248,157,75,.22); color: var(--amber); }
  .status-err { background: #7f1d1d; color: #fca5a5; }
  .uptime { position: fixed; bottom: 1rem; right: 1rem; font-size: .75rem; color: var(--muted); }
  .env-badge { position: fixed; top: 1rem; right: 1rem; padding: .25rem .75rem; font-size: .75rem; font-weight: 600; }
  .env-production { background: #065f46; color: #6ee7b7; }
  .env-staging { background: rgba(248,157,75,.22); color: var(--amber); }
  .env-development { background: rgba(118,154,204,.22); color: var(--sky); }
  .bar { height: 8px; background: rgba(230,221,214,.18); margin-top: .5rem; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 1s; }
  .bar-green { background: #22c55e; }
  .bar-yellow { background: var(--gold); }
  .bar-red { background: #ef4444; }
  .refresh { color: var(--gold); cursor: pointer; text-decoration: underline; display: inline-block; transition: transform .2s ease, color .2s ease; }
  .refresh:hover { color: var(--amber); transform: translateX(3px); }
</style>
</head>
<body>
  <h1><i class="fa-solid fa-chart-line" aria-hidden="true"></i> Kivo Pulse</h1>
  <p class="subtitle">System Health Dashboard <span class="refresh" onclick="location.reload()"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Refresh</span></p>
  <div class="grid" id="metrics"></div>
  <div class="env-badge" id="envBadge">loading...</div>
  <div class="uptime" id="uptime"></div>

<script>
const API = window.location.origin;

async function load() {
  try {
    const res = await fetch(API + '/health');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('metrics').innerHTML = `<div class="card"><h3>Error</h3><div class="value" style="color:#fca5a5">${e.message}</div></div>`;
  }
}

function render(data) {
  const metrics = [
    { label: 'Status', value: data.status || data.data?.status || 'unknown', cls: (data.status === 'ok' || data.data?.status === 'ok') ? 'status-ok' : 'status-err' },
    { label: 'Database', value: data.database || data.data?.database_ok ? 'Connected' : 'Disconnected', cls: (data.database || data.data?.database_ok) ? 'status-ok' : 'status-err' },
    { label: 'Redis', value: data.redis === 'connected' ? 'Connected' : data.redis === 'disconnected' ? 'Disconnected' : 'Unknown', cls: data.redis === 'connected' ? 'status-ok' : (data.redis === 'disconnected' ? 'status-err' : 'status-warn') },
    { label: 'API Version', value: data.version || data.data?.version || '—', cls: 'status-ok' },
    { label: 'OpenAI', value: data.openai ? 'Configured' : 'Not configured', cls: data.openai ? 'status-ok' : 'status-warn' },
    { label: 'Uptime', value: data.uptime ? formatUptime(data.uptime) : '—', cls: 'status-ok' },
  ];

  document.getElementById('metrics').innerHTML = metrics.map(m => `
    <div class="card">
      <h3>${m.label}</h3>
      <div><span class="status ${m.cls}">${m.value}</span></div>
    </div>
  `).join('');

  // Environment badge
  const env = data.environment || data.data?.environment || 'development';
  document.getElementById('envBadge').className = 'env-badge env-' + env;
  document.getElementById('envBadge').textContent = env.toUpperCase();

  // Timestamp
  document.getElementById('uptime').textContent = 'Last check: ' + new Date().toLocaleTimeString();
}

function formatUptime(s) {
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  return `${d}d ${h}h ${m}m`;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
