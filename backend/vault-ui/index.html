<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDS Vault — Credential Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23FCB900'/><text x='16' y='22' text-anchor='middle' font-size='18' font-weight='bold' fill='%23171414'>V</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #171414;
  color: #FCF6F2;
  min-height: 100vh;
}
::selection { background: #FCB900; color: #171414; }

/* Login */
.login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
  background: radial-gradient(ellipse at 50% 0%, #2a2525 0%, #171414 70%);
}
.login-box {
  background: #2a2525; padding: 48px 40px 40px; border-radius: 16px;
  width: 100%; max-width: 380px; border: 1px solid #3D3B3B;
  text-align: center;
}
.login-box .logo {
  width: 100px; height: 36px; margin: 0 auto 24px;
}
.login-box h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-box h1 span { color: #FCB900; }
.login-box p { color: #838081; margin-bottom: 28px; font-size: 14px; }
.login-box input {
  width: 100%; padding: 14px 16px; border-radius: 10px;
  border: 1px solid #3D3B3B; background: #171414; color: #FCF6F2;
  font-size: 15px; margin-bottom: 16px; outline: none;
  transition: border-color .2s;
}
.login-box input:focus { border-color: #FCB900; }
.login-box button {
  width: 100%; padding: 14px; border-radius: 10px;
  border: none; background: #FCB900; color: #171414;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: background .2s;
}
.login-box button:hover { background: #e0a500; }
.login-box .error { color: #ef4444; font-size: 14px; margin-top: 14px; display: none; }

/* App */
.app { display: none; }

/* Header */
.header {
  background: #2a2525; border-bottom: 1px solid #3D3B3B;
  padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; gap: 16px;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo svg { width: 32px; height: 32px; }
.header-logo h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.header-logo h1 span { color: #FCB900; }
.header-right { display: flex; align-items: center; gap: 16px; }
.header .stats { display: flex; gap: 20px; }
.header .stats span { color: #838081; font-size: 12px; }
.header .stats b { color: #FCF6F2; font-weight: 600; }
.header .logout-btn {
  background: none; border: 1px solid #3D3B3B; color: #838081;
  padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 12px;
  transition: all .2s; font-weight: 500;
}
.header .logout-btn:hover { color: #FCF6F2; border-color: #5c5959; }

/* Controls */
.controls {
  padding: 16px 24px 8px; display: flex; gap: 10px; flex-wrap: wrap;
}
.controls input, .controls select {
  padding: 9px 14px; border-radius: 8px; border: 1px solid #3D3B3B;
  background: #2a2525; color: #FCF6F2; font-size: 13px; outline: none;
  transition: border-color .2s;
}
.controls input:focus, .controls select:focus { border-color: #FCB900; }
.controls input { flex: 1; min-width: 200px; }
.controls input::placeholder { color: #5c5959; }

/* Service filter chips */
.service-chips {
  padding: 8px 24px 4px; display: flex; gap: 6px; flex-wrap: wrap;
}
.service-chips button {
  padding: 5px 14px; border-radius: 20px; border: 1px solid #3D3B3B;
  background: transparent; color: #838081; cursor: pointer; font-size: 12px;
  transition: all .2s; font-weight: 500;
}
.service-chips button:hover { border-color: #FCB900; color: #FCB900; }
.service-chips button.active { background: #FCB900; border-color: #FCB900; color: #171414; font-weight: 600; }

/* Category badge colors */
.cat-wordpress { background: #142444; color: #769ACC; }
.cat-database { background: #1a3a2a; color: #34d399; }
.cat-server { background: #3d1f1a; color: #f59e0b; }
.cat-email { background: #1a2a44; color: #769ACC; }
.cat-api { background: #2a1a3a; color: #a78bfa; }
.cat-other { background: #2a2a2a; color: #838081; }

/* Grid */
.grid {
  padding: 16px 24px 24px; display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
}
.card {
  background: #2a2525; border-radius: 12px; border: 1px solid #3D3B3B;
  padding: 18px 20px; transition: border-color .2s, box-shadow .2s;
}
.card:hover { border-color: #5c5959; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
.card .card-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 12px; gap: 8px;
}
.card .service-name {
  color: #FCB900; font-size: 11px; text-transform: uppercase;
  letter-spacing: .06em; font-weight: 600;
}
.card .label { font-size: 15px; font-weight: 600; line-height: 1.3; }
.card .category-badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; white-space: nowrap;
}
.card .fields { margin-top: 10px; }
.card .field { margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; }
.card .field-icon { color: #5c5959; font-size: 13px; width: 14px; text-align: center; margin-top: 2px; flex-shrink: 0; }
.card .field-body { flex: 1; min-width: 0; }
.card .field-label { font-size: 10px; color: #5c5959; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; font-weight: 500; }
.card .field-value {
  display: flex; align-items: center; gap: 6px;
  font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace; font-size: 12.5px;
}
.card .field-value .val-hidden { color: #5c5959; }
.card .field-value .val-revealed { color: #FCF6F2; }
.card .field-value .val-empty { color: #5c5959; font-style: italic; font-family: inherit; font-size: 11px; }
.card .field-btn {
  background: none; border: 1px solid #3D3B3B; color: #FCB900;
  cursor: pointer; font-size: 10px; padding: 2px 8px; border-radius: 5px;
  transition: all .2s; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  white-space: nowrap; flex-shrink: 0;
}
.card .field-btn:hover { background: #FCB900; color: #171414; border-color: #FCB900; }
.card .copy-btn {
  color: #10b981; font-size: 11px; cursor: pointer; font-weight: 600;
  transition: color .2s; white-space: nowrap;
}
.card .copy-btn:hover { color: #34d399; }
.card .url {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid #3D3B3B;
  font-size: 11px;
}
.card .url a { color: #FCB900; text-decoration: none; display: flex; align-items: center; gap: 4px; }
.card .url a:hover { text-decoration: underline; }

/* Loading */
.loading {
  text-align: center; padding: 80px 24px;
}
.loading .spinner {
  width: 36px; height: 36px; border: 3px solid #3D3B3B;
  border-top-color: #FCB900; border-radius: 50%;
  animation: spin .7s linear infinite; margin: 0 auto 18px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { color: #838081; font-size: 14px; }

/* Empty */
.empty { text-align: center; padding: 80px 24px; }
.empty .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .3; }
.empty h3 { margin-bottom: 6px; font-size: 16px; }
.empty p { color: #838081; font-size: 13px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #10b981; color: #fff; padding: 12px 24px;
  border-radius: 10px; font-size: 13px; font-weight: 600;
  display: none; animation: slideUp .25s ease; z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
}
.toast.error { background: #ef4444; }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* Footer */
.footer {
  text-align: center; padding: 24px; color: #3D3B3B; font-size: 11px;
  border-top: 1px solid #2a2525; margin-top: 20px;
}
.footer a { color: #5c5959; text-decoration: none; }
.footer a:hover { color: #838081; }

@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; padding: 12px; }
  .header { flex-direction: column; align-items: stretch; gap: 10px; }
  .header-right { justify-content: space-between; }
  .header .stats { gap: 12px; }
  .controls { padding: 12px; }
  .service-chips { padding: 4px 12px; }
}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <svg class="logo" viewBox="0 0 100 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="36" rx="6" fill="#FCB900"/>
      <text x="12" y="24" font-family="system-ui" font-size="16" font-weight="800" fill="#171414">TDS</text>
      <text x="56" y="24" font-family="system-ui" font-size="16" font-weight="300" fill="#171414">VAULT</text>
    </svg>
    <p>Enter the vault password to access credentials</p>
    <input type="password" id="passwordInput" placeholder="Vault password" autofocus>
    <button onclick="login()">Unlock Vault</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="6" fill="#FCB900"/>
          <text x="16" y="22" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#171414">V</text>
        </svg>
        <h1>TDS <span>Vault</span></h1>
      </div>
      <div class="stats">
        <span>Credentials <b id="totalCount">0</b></span>
        <span>Categories <b id="catCount">0</b></span>
      </div>
    </div>
    <div class="header-right">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search credentials..." oninput="render()">
    <select id="categoryFilter" onchange="render()">
      <option value="">All Categories</option>
      <option value="wordpress">WordPress</option>
      <option value="database">Database</option>
      <option value="server">Server</option>
      <option value="email">Email</option>
      <option value="api">API</option>
      <option value="other">Other</option>
    </select>
  </div>

  <div class="service-chips" id="serviceFilters"></div>
  <div id="content"></div>

  <div class="footer">
    <span>TDS Geo — AI SEO Automation System</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let token = localStorage.getItem('vault_token');
let credentials = [];
let revealed = {};
let selectedService = '';
let services = [];

async function login() {
  const password = document.getElementById('passwordInput').value;
  const error = document.getElementById('loginError');
  error.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (!res.ok) { error.textContent = data.error || 'Invalid password'; error.style.display = 'block'; return; }
    token = data.token;
    localStorage.setItem('vault_token', token);
    enterApp();
  } catch { error.textContent = 'Connection error'; error.style.display = 'block'; }
}

function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadCredentials();
}

function logout() {
  localStorage.removeItem('vault_token');
  token = null;
  revealed = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('passwordInput').value = '';
}

async function loadCredentials() {
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading credentials...</p></div>';
  try {
    const res = await fetch('/api/credentials', {
      headers: { 'X-Vault-Token': token }
    });
    if (res.status === 401) { logout(); return; }
    credentials = (await res.json()).credentials;
    services = [...new Set(credentials.map(c => c.service))].sort();
    renderServiceFilters();
    render();
  } catch {
    document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">&#9888;</div><h3>Failed to load</h3><p>Check if the server is running</p></div>';
  }
}

function renderServiceFilters() {
  const div = document.getElementById('serviceFilters');
  div.innerHTML = '<button class="' + (!selectedService ? 'active' : '') + '" onclick="selectService(\'\')">All</button>';
  services.forEach(s => {
    div.innerHTML += '<button class="' + (selectedService === s ? 'active' : '') + '" onclick="selectService(\'' + escAttr(s) + '\')">' + esc(s) + '</button>';
  });
}

function selectService(s) {
  selectedService = s;
  renderServiceFilters();
  render();
}

function catClass(category) {
  return 'cat-' + (category || 'other');
}

function catIcon(category) {
  const icons = { wordpress:'W', database:'DB', server:'S', email:'@', api:'Key', other:'•' };
  return icons[category] || '•';
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  let filtered = credentials.filter(c => {
    if (selectedService && c.service !== selectedService) return false;
    if (category && c.category !== category) return false;
    if (search && !c.label.toLowerCase().includes(search) && !c.service.toLowerCase().includes(search) && !(c.url||'').toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('totalCount').textContent = filtered.length;
  document.getElementById('catCount').textContent = new Set(filtered.map(c => c.category)).size;

  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">&#128270;</div><h3>No credentials found</h3><p>Try a different search or category</p></div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    const userRevealed = revealed[c.id + '_u'];
    const passRevealed = revealed[c.id + '_p'];
    const cat = c.category || 'other';
    card.innerHTML =
      '<div class="card-header">' +
        '<div><div class="service-name">' + esc(c.service) + '</div><div class="label">' + esc(c.label) + '</div></div>' +
        '<span class="category-badge ' + catClass(cat) + '">' + catIcon(cat) + ' ' + esc(cat) + '</span>' +
      '</div>' +
      '<div class="fields">' +
        '<div class="field">' +
          '<div class="field-icon">&#128100;</div>' +
          '<div class="field-body">' +
            '<div class="field-label">Username</div>' +
            '<div class="field-value">' +
              (c.masked_username
                ? '<span class="' + (userRevealed ? 'val-revealed' : 'val-hidden') + '" id="user_' + c.id + '">' + esc(userRevealed || c.masked_username) + '</span>'
                : '<span class="val-empty">Not set</span>') +
              (c.masked_username
                ? '<button class="field-btn" onclick="revealUser(\'' + c.id + '\')">' + (userRevealed ? 'Hide' : 'Show') + '</button>'
                : '') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-icon">&#128274;</div>' +
          '<div class="field-body">' +
            '<div class="field-label">Password</div>' +
            '<div class="field-value">' +
              '<span class="' + (passRevealed ? 'val-revealed' : 'val-hidden') + '" id="pass_' + c.id + '">' +
                (passRevealed !== undefined
                  ? (passRevealed ? esc(passRevealed) : '<span class="val-empty">No password</span>')
                  : (c.masked_password ? esc(c.masked_password) : '<span class="val-empty">Not set</span>')) +
              '</span>' +
              (c.masked_password
                ? '<button class="field-btn" onclick="revealPass(\'' + c.id + '\')">' + (passRevealed ? 'Hide' : 'Show') + '</button>'
                : '') +
              (passRevealed
                ? '<span class="copy-btn" onclick="copy(\'' + escAttr(passRevealed) + '\', event)">Copy</span>'
                : '') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      (c.url ? '<div class="url"><a href="' + escAttr(c.url) + '" target="_blank">&#128279; ' + esc(c.url) + '</a></div>' : '');
    grid.appendChild(card);
  });
  document.getElementById('content').innerHTML = '';
  document.getElementById('content').appendChild(grid);
}

async function revealUser(id) {
  if (revealed[id + '_u']) { delete revealed[id + '_u']; render(); return; }
  try {
    const res = await fetch('/api/credentials/' + id, {
      headers: { 'X-Vault-Token': token }
    });
    if (!res.ok) return;
    const data = await res.json();
    revealed[id + '_u'] = data.username || '';
    revealed[id + '_p'] = data.password || '';
    render();
  } catch {}
}

async function revealPass(id) {
  if (revealed[id + '_p']) { delete revealed[id + '_p']; render(); return; }
  try {
    const res = await fetch('/api/credentials/' + id, {
      headers: { 'X-Vault-Token': token }
    });
    if (!res.ok) return;
    const data = await res.json();
    revealed[id + '_u'] = data.username || '';
    revealed[id + '_p'] = data.password || '';
    render();
  } catch {}
}

function copy(text, event) {
  if (event) event.stopPropagation();
  navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => {});
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000);
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

if (token) enterApp();
</script>
</body>
</html>
