# ════════════════════════════════════════════════════════════════
# Dependabot Configuration
# All updates grouped into a single weekly PR per ecosystem
# to keep the inbox clean. Rebase manually if a PR conflicts.
# ════════════════════════════════════════════════════════════════

version: 2
updates:

  # ─── Backend npm dependencies ──────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    versioning-strategy: increase
    assignees:
      - "yusuf-mohamed0"
    labels:
      - "dependencies"
    groups:
      all-deps:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ─── Frontend npm dependencies ─────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    versioning-strategy: increase
    assignees:
      - "yusuf-mohamed0"
    labels:
      - "dependencies"
    groups:
      all-deps:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ─── Docker base images ────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    assignees:
      - "yusuf-mohamed0"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions workflow updates ──────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    assignees:
      - "yusuf-mohamed0"
    labels:
      - "dependencies"
