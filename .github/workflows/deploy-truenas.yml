name: Deploy TrueNAS

on:
  workflow_dispatch:

concurrency:
  group: truenas-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build TrueNAS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy On TrueNAS Runner
    needs: build
    runs-on: [self-hosted, Linux, X64, truenas, tdsgeo]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync repository to runner deploy directory
        env:
          TRUENAS_ENV: ${{ secrets.TRUENAS_ENV }}
          TRUENAS_ENV_B64: ${{ secrets.TRUENAS_ENV_B64 }}
        run: |
          DEPLOY_ROOT="$HOME/tds-geo-deploy"
          DEPLOY_ROOT="$DEPLOY_ROOT" ./deploy/truenas/scripts/prepare-env.sh

          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'kivo-nextjs/node_modules' \
            --exclude 'deploy/truenas/.env' \
            --exclude 'deploy/truenas/.previous-image' \
            ./ "$DEPLOY_ROOT/"

      - name: Deploy reporting runner (Meta mediabuying reports)
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT_REPORTING }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: |
          if [[ -z "${META_SYSTEM_USER_TOKEN:-}" ]]; then
            echo "Skipping reporting runner deploy: META_SYSTEM_USER_TOKEN secret not set"
            exit 0
          fi
          RUNNER_ROOT="$HOME/tds-ads-reporting-automation"
          mkdir -p "$RUNNER_ROOT"
          if [[ -d "$RUNNER_ROOT/.git" ]]; then
            git -C "$RUNNER_ROOT" -c credential.helper= fetch --depth 1 origin main && git -C "$RUNNER_ROOT" reset --hard FETCH_HEAD
          else
            git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/yusuf-mohamed0/tds-ads-reporting-automation.git" "$RUNNER_ROOT"
          fi
          cd "$RUNNER_ROOT"
          python3 -m venv .venv 2>/dev/null || true
          if [[ ! -x .venv/bin/python ]]; then
            python3 -m venv --without-pip .venv 2>/dev/null || true
            mkdir -p .venv/bin
            [[ -e .venv/bin/python ]] || ln -sf "$(command -v python3)" .venv/bin/python
            [[ -e .venv/bin/pip ]] || ln -sf "$(command -v pip3)" .venv/bin/pip
          fi
          ./.venv/bin/pip install --quiet -r requirements.txt 2>/dev/null || pip3 install --user --quiet -r requirements.txt 2>/dev/null || true
          mkdir -p logs reports data configs
          [[ -f configs/clients.yaml ]] || cp configs/clients.example.yaml configs/clients.yaml
          # Reuse the heartbeat Gmail SMTP credentials already configured on the host.
          # Secret-provided values are kept as fallback when the host file is absent.
          SMTP_USER_SECRET="${SMTP_USER:-}"
          SMTP_PASSWORD_SECRET="${SMTP_PASSWORD:-}"
          TRUENAS_ENV_FILE="$HOME/tds-geo-deploy/deploy/truenas/.env"
          if [[ -f "$TRUENAS_ENV_FILE" ]]; then
            set -a; . "$TRUENAS_ENV_FILE"; set +a
          fi
          REPORT_RECIPIENT="${REPORT_RECIPIENT:-${HEARTBEAT_EMAIL_TO:-reports@trafficdigitalsolutions.com}}"
          SMTP_HOST="${SMTP_HOST:-smtp.gmail.com}"
          SMTP_PORT="${SMTP_PORT:-587}"
          SMTP_USER="${SMTP_USER:-$SMTP_USER_SECRET}"
          SMTP_PASSWORD="${SMTP_PASSWORD:-${SMTP_PASS:-$SMTP_PASSWORD_SECRET}}"
          SMTP_SENDER="${SMTP_SENDER:-$SMTP_USER}"
          {
            printf 'META_SYSTEM_USER_TOKEN=%s\n' "$META_SYSTEM_USER_TOKEN"
            printf 'META_API_VERSION=%s\n' "${META_API_VERSION:-v26.0}"
            [[ -n "$META_PAGE_ACCESS_TOKEN" ]] && printf 'META_PAGE_ACCESS_TOKEN=%s\n' "$META_PAGE_ACCESS_TOKEN"
            printf 'REPORT_RECIPIENT=%s\n' "$REPORT_RECIPIENT"
            printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_PASSWORD=%s\nSMTP_SENDER=%s\nSMTP_STARTTLS=%s\n' "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USER" "${SMTP_PASSWORD:-$SMTP_PASS}" "$SMTP_SENDER" "${SMTP_STARTTLS:-true}"
            printf 'REPORTS_DIR=%s/reports\n' "$RUNNER_ROOT"
            printf 'LOGS_DIR=%s/logs\n' "$RUNNER_ROOT"
            printf 'SQLITE_PATH=%s/data/reporting.sqlite\n' "$RUNNER_ROOT"
          } > .env
          ./scripts/install-monthly-cron.sh || true
          echo "Reporting runner deployed to $RUNNER_ROOT"

      - name: Deploy Compose stack
        run: |
          cd "$HOME/tds-geo-deploy/deploy/truenas"
          export ADS_REPORTING_ROOT="${HOME}/tds-ads-reporting-automation"
          TDS_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas" ./scripts/deploy.sh
