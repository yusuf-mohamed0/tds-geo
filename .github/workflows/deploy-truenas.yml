name: Deploy TrueNAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/truenas/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

concurrency:
  group: truenas-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build TrueNAS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy On TrueNAS Runner
    needs: build
    runs-on: [self-hosted, truenas, tds-geo]
    steps:
      - uses: actions/checkout@v4

      - name: Sync repository to /opt/tds-geo
        run: |
          sudo mkdir -p /opt/tds-geo
          sudo rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'tds-geo-nextjs/node_modules' \
            ./ /opt/tds-geo/

      - name: Deploy Compose stack
        run: |
          cd /opt/tds-geo/deploy/truenas
          TDS_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas" ./scripts/deploy.sh
