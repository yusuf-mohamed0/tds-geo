name: Deploy TrueNAS

on:
  workflow_dispatch:

concurrency:
  group: truenas-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build TrueNAS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy On TrueNAS Runner
    needs: build
    runs-on: [self-hosted, truenas, kivo]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sync repository to /opt/kivo
        run: |
          sudo mkdir -p /opt/kivo
          sudo rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'kivo-nextjs/node_modules' \
            --exclude 'deploy/truenas/.env' \
            --exclude 'deploy/truenas/.previous-image' \
            ./ /opt/kivo/

      - name: Deploy Compose stack
        run: |
          cd /opt/kivo/deploy/truenas
          TDS_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:truenas" ./scripts/deploy.sh
