name: TrueNAS Shopify Token Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, truenas, tdsgeo]
    timeout-minutes: 10
    steps:
      - name: Check live Shopify tokens
        run: |
          set -euo pipefail
          api="$(docker ps -q | while read -r id; do docker exec "$id" sh -c 'test -f /app/dist/backend/index.js' >/dev/null 2>&1 && echo "$id" && break; done)"
          if [[ -z "$api" ]]; then
            echo "No live API container found"
            exit 1
          fi
          postgres="$(docker ps -q | while read -r id; do docker exec "$id" sh -c 'printenv POSTGRES_USER >/dev/null 2>&1 && printenv POSTGRES_DB >/dev/null 2>&1' >/dev/null 2>&1 && echo "$id" && break; done)"
          if [[ -z "$postgres" ]]; then
            echo "No live Postgres container found"
            exit 1
          fi

          db_user="$(docker exec "$postgres" printenv POSTGRES_USER)"
          db_name="$(docker exec "$postgres" printenv POSTGRES_DB)"
          default_version="$(docker exec "$api" printenv SHOPIFY_DEFAULT_API_VERSION 2>/dev/null || true)"
          default_version="${default_version:-2025-07}"

          query="
          WITH target(slug, fallback_shop) AS (
            VALUES
              ('alamein-2022', 'alamein-2022.myshopify.com'),
              ('caravanserai', 'caravanserai-gift-store.myshopify.com'),
              ('flaunt-cosmetics-global', 'c9d9a9.myshopify.com')
          ), latest_connection AS (
            SELECT DISTINCT ON (client_id)
              client_id,
              id,
              status,
              config
            FROM cms_connections
            WHERE provider = 'shopify'
            ORDER BY client_id, id DESC
          )
          SELECT
            target.slug,
            COALESCE(c.shopify_shop, target.fallback_shop) AS shop,
            (c.id IS NOT NULL)::text AS has_client,
            (c.shopify_token IS NOT NULL)::text AS has_client_token,
            (latest_connection.id IS NOT NULL)::text AS has_cms_connection,
            COALESCE(latest_connection.status, 'none') AS cms_status,
            ((latest_connection.config ? 'accessToken') OR (latest_connection.config ? 'access_token') OR (latest_connection.config ? 'token'))::text AS has_cms_token,
            COALESCE(latest_connection.config->>'apiVersion', '$default_version') AS api_version,
            COALESCE(latest_connection.config->>'accessToken', latest_connection.config->>'access_token', latest_connection.config->>'token', c.shopify_token, '') AS token
          FROM target
          LEFT JOIN clients c
            ON c.slug = target.slug
            OR c.shopify_shop = target.fallback_shop
          LEFT JOIN latest_connection
            ON latest_connection.client_id = c.id
          ORDER BY target.slug;
          "

          failures=0
          while IFS=$'\t' read -r slug shop has_client has_client_token has_cms_connection cms_status has_cms_token api_version token; do
            if [[ "$has_client" != "true" ]]; then
              echo "$slug: missing_client"
              failures=$((failures + 1))
              continue
            fi

            if [[ -z "$token" ]]; then
              status="missing_token"
            else
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "X-Shopify-Access-Token: $token" \
                -H 'Accept: application/json' \
                "https://${shop}/admin/api/${api_version}/shop.json" || true)"
            fi

            if [[ "$status" != "200" ]]; then
              failures=$((failures + 1))
            fi

            echo "$slug: shop=$shop client_token=$has_client_token cms_connection=$has_cms_connection cms_status=$cms_status cms_token=$has_cms_token api_version=$api_version shopify_status=$status"
          done < <(docker exec "$postgres" psql -U "$db_user" -d "$db_name" -At -F $'\t' -c "$query")

          exit "$failures"
