name: Sync TrueNAS Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: truenas-intelligence
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Source, n8n Exports, and GitNexus
    runs-on: [self-hosted, Linux, X64, truenas, tdsgeo]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Sync clean analysis checkout
        run: |
          sudo mkdir -p /opt/tds-geo/kivo-source
          sudo chown -R "$USER:$USER" /opt/tds-geo/kivo-source
          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'kivo-nextjs/node_modules' \
            --exclude 'deploy/truenas/.env' \
            ./ /opt/tds-geo/kivo-source/
          git rev-parse HEAD > /opt/tds-geo/kivo-source/.source-commit

      - name: Refresh GitNexus pairing
        run: |
          KIVO_SOURCE_DIR=/opt/tds-geo/kivo-source \
          /opt/tds-geo/kivo-source/deploy/truenas/scripts/sync-intelligence.sh
