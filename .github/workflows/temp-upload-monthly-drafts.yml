name: Temp Upload Monthly Drafts

on:
  workflow_dispatch:

jobs:
  upload-hidden-drafts:
    runs-on: [self-hosted, Linux, X64, truenas, tdsgeo]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage monthly draft articles inside API container
        run: |
          set -euo pipefail
          STAGE_DIR="/tmp/monthly-drafts-${GITHUB_RUN_ID}"
          mkdir -p "$STAGE_DIR"
          for f in \
            doc/clients/alamein-2022/articles/alamein-egyptian-cafes-outdoor-furniture.md \
            doc/clients/alamein-2022/articles/alamein-playground-equipment-schools-compounds.md \
            doc/clients/alamein-2022/articles/alamein-outdoor-fitness-areas-egypt.md \
            doc/clients/alamein-2022/articles/alamein-storing-maintaining-outdoor-furniture.md \
            doc/clients/caravanserai/articles/caravanserai-brass-room-styling.md \
            doc/clients/caravanserai/articles/caravanserai-zamalek-handmade-furniture-guide.md \
            doc/clients/caravanserai/articles/caravanserai-layering-wood-brass-textiles-living-room.md \
            doc/clients/caravanserai/articles/caravanserai-meaningful-home-gifts-cairo.md \
            doc/clients/flaunt-cosmetics-global/articles/flaunt-eyeliner-stamp-calm-first-routine.md \
            doc/clients/flaunt-cosmetics-global/articles/flaunt-hooded-eyes-winged-liner.md \
            doc/clients/flaunt-cosmetics-global/articles/flaunt-dubai-heat-eyeliner-guide.md \
            doc/clients/flaunt-cosmetics-global/articles/flaunt-stamp-vs-liquid-eyeliner.md \
            doc/clients/boston-pharma/articles/boston-pharma-quality-control-egypt.md \
            doc/clients/boston-pharma/articles/boston-pharma-medicine-storage-conditions.md \
            doc/clients/boston-pharma/articles/boston-pharma-reading-supplement-labels-egypt.md \
            doc/clients/boston-pharma/articles/boston-pharma-gmp-documentation-matters.md
          do
            dir="$STAGE_DIR/$(dirname "$f")"
            mkdir -p "$dir"
            cp "$GITHUB_WORKSPACE/$f" "$dir/"
          done
          docker exec tds-geo-api-1 sh -c "mkdir -p $STAGE_DIR"
          docker cp "$STAGE_DIR/." tds-geo-api-1:"$STAGE_DIR/"

      - name: Upload 16 hidden monthly drafts to client CMS
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/upload-monthly-drafts.mjs <<'NODE'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');
          const { Pool } = require('pg');

          const draftsDir = process.env.DRAFTS_DIR || '/tmp/monthly-drafts';

          const INTERNAL_SECTIONS = ['GEO/AEO Answer Capsule', 'Meta Draft', 'FAQ Opportunities', 'Publishing Checklist'];

          const INTERNAL_MARKERS = [
            'GEO/AEO Answer Capsule', 'Meta Draft', 'FAQ Opportunities', 'Publishing Checklist',
            'Do not publish', 'connector repair', 'token is repaired', 'Shopify token',
            'WordPress write credentials', 'CMS Publisher', 'QA Operator', 'Senior SEO Strategist',
            'Editorial Director', 'Content Researcher', 'EEAT Consultant', 'GEO/AEO Specialist',
            'Compliance Reviewer',
          ];

          const MANIFEST = [
            { client: 'alamein-2022', provider: 'shopify', blogId: '79774056505', file: 'doc/clients/alamein-2022/articles/alamein-egyptian-cafes-outdoor-furniture.md' },
            { client: 'alamein-2022', provider: 'shopify', blogId: '79774056505', file: 'doc/clients/alamein-2022/articles/alamein-playground-equipment-schools-compounds.md' },
            { client: 'alamein-2022', provider: 'shopify', blogId: '79774056505', file: 'doc/clients/alamein-2022/articles/alamein-outdoor-fitness-areas-egypt.md' },
            { client: 'alamein-2022', provider: 'shopify', blogId: '79774056505', file: 'doc/clients/alamein-2022/articles/alamein-storing-maintaining-outdoor-furniture.md' },
            { client: 'caravanserai', provider: 'shopify', blogId: '78074216615', file: 'doc/clients/caravanserai/articles/caravanserai-brass-room-styling.md' },
            { client: 'caravanserai', provider: 'shopify', blogId: '78074216615', file: 'doc/clients/caravanserai/articles/caravanserai-zamalek-handmade-furniture-guide.md' },
            { client: 'caravanserai', provider: 'shopify', blogId: '78074216615', file: 'doc/clients/caravanserai/articles/caravanserai-layering-wood-brass-textiles-living-room.md' },
            { client: 'caravanserai', provider: 'shopify', blogId: '78074216615', file: 'doc/clients/caravanserai/articles/caravanserai-meaningful-home-gifts-cairo.md' },
            { client: 'flaunt-cosmetics-global', provider: 'shopify', blogId: '116005503268', file: 'doc/clients/flaunt-cosmetics-global/articles/flaunt-eyeliner-stamp-calm-first-routine.md' },
            { client: 'flaunt-cosmetics-global', provider: 'shopify', blogId: '116005503268', file: 'doc/clients/flaunt-cosmetics-global/articles/flaunt-hooded-eyes-winged-liner.md' },
            { client: 'flaunt-cosmetics-global', provider: 'shopify', blogId: '116005503268', file: 'doc/clients/flaunt-cosmetics-global/articles/flaunt-dubai-heat-eyeliner-guide.md' },
            { client: 'flaunt-cosmetics-global', provider: 'shopify', blogId: '116005503268', file: 'doc/clients/flaunt-cosmetics-global/articles/flaunt-stamp-vs-liquid-eyeliner.md' },
            { client: 'boston-pharma', provider: 'wordpress', blogId: null, file: 'doc/clients/boston-pharma/articles/boston-pharma-quality-control-egypt.md' },
            { client: 'boston-pharma', provider: 'wordpress', blogId: null, file: 'doc/clients/boston-pharma/articles/boston-pharma-medicine-storage-conditions.md' },
            { client: 'boston-pharma', provider: 'wordpress', blogId: null, file: 'doc/clients/boston-pharma/articles/boston-pharma-reading-supplement-labels-egypt.md' },
            { client: 'boston-pharma', provider: 'wordpress', blogId: null, file: 'doc/clients/boston-pharma/articles/boston-pharma-gmp-documentation-matters.md' },
          ];

          const STOPWORDS = new Set(['for', 'the', 'and', 'with', 'in', 'of', 'vs', 'to', 'from', 'that', 'this', 'egypt', 'cairo']);

          function stripFrontmatter(md) {
            return md.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, '');
          }
          function parseFrontmatter(md) {
            const fm = {};
            const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
            if (!m) return fm;
            for (const line of m[1].split('\n')) {
              const kv = line.match(/^([a-zA-Z_][\w]*):\s*(.*)$/);
              if (kv) fm[kv[1]] = kv[2].trim().replace(/^"(.*)"$/, '$1');
            }
            return fm;
          }
          function stripInternalSections(md) {
            const lines = md.split('\n');
            const keep = [];
            let dropping = null;
            for (const line of lines) {
              const h = line.match(/^##\s+(.+)$/);
              if (h) {
                const title = h[1].trim();
                if (INTERNAL_SECTIONS.includes(title)) { dropping = title; continue; }
                dropping = null;
              }
              if (dropping) continue;
              keep.push(line);
            }
            return keep.join('\n');
          }
          function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          }
          function inline(text) {
            let s = escapeHtml(text);
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
            return s;
          }
          function mdToHtml(md) {
            const lines = md.split('\n');
            const out = [];
            let listType = null;
            let para = [];
            const flushPara = () => { if (para.length) { out.push(`<p>${para.join(' ')}</p>`); para = []; } };
            const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
            for (const raw of lines) {
              const line = raw.trimEnd();
              if (!line.trim()) { flushPara(); closeList(); continue; }
              const h1 = line.match(/^# (.+)$/);
              const h2 = line.match(/^## (.+)$/);
              const h3 = line.match(/^### (.+)$/);
              if (h1) { flushPara(); closeList(); out.push(`<h1>${inline(h1[1])}</h1>`); continue; }
              if (h2) { flushPara(); closeList(); out.push(`<h2>${inline(h2[1])}</h2>`); continue; }
              if (h3) { flushPara(); closeList(); out.push(`<h3>${inline(h3[1])}</h3>`); continue; }
              const ul = line.match(/^[-*]\s+(.+)$/);
              const ol = line.match(/^\d+\.\s+(.+)$/);
              if (ul) { flushPara(); if (listType !== 'ul') { closeList(); listType = 'ul'; out.push('<ul>'); } out.push(`<li>${inline(ul[1])}</li>`); continue; }
              if (ol) { flushPara(); if (listType !== 'ol') { closeList(); listType = 'ol'; out.push('<ol>'); } out.push(`<li>${inline(ol[1])}</li>`); continue; }
              if (/^-{3,}$/.test(line.trim())) { flushPara(); closeList(); out.push('<hr>'); continue; }
              para.push(inline(line.trim()));
            }
            flushPara(); closeList();
            return out.join('\n');
          }
          function text(html) { return String(html || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim(); }
          function truncate(value, max) { const chars = Array.from(String(value || '').trim()); return chars.length <= max ? chars.join('') : chars.slice(0, max - 1).join('').trimEnd() + '…'; }
          function findMarkers(html) {
            const t = text(html).toLowerCase();
            return INTERNAL_MARKERS.filter(m => t.includes(m.toLowerCase()));
          }
          function buildTags(primaryKeyword) {
            const pk = String(primaryKeyword || '').trim();
            const words = pk.toLowerCase().split(/[\s,]+/).filter(w => w.length >= 3 && !STOPWORDS.has(w));
            const tags = [];
            if (pk) tags.push(pk);
            for (const w of words) if (tags.length < 4 && !tags.includes(w)) tags.push(w);
            return tags;
          }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function request(options) {
            return new Promise((resolve, reject) => {
              const req = https.request(options.url, { method: options.method, headers: options.headers || {}, timeout: 30000 }, res => {
                let data = ''; res.on('data', c => data += c); res.on('end', () => {
                  let json = null; try { json = data ? JSON.parse(data) : null; } catch {}
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve({ status: res.statusCode, json, headers: res.headers });
                  else reject(new Error(JSON.stringify({ status: res.statusCode, body: json || data.slice(0, 300) })));
                });
              });
              req.on('timeout', () => req.destroy(new Error('timeout'))); req.on('error', reject);
              if (options.body) req.write(options.body);
              req.end();
            });
          }

          async function fetchShopifyConnection(pool, slug) {
            const { rows } = await pool.query(`select c.shopify_shop, c.shopify_api_version, c.shopify_token, cc.config from clients c join cms_connections cc on cc.client_id = c.id where c.slug = $1 and cc.provider = 'shopify' and cc.is_active = true order by cc.updated_at desc nulls last limit 1`, [slug]);
            if (!rows.length) return null;
            const row = rows[0];
            const config = typeof row.config === 'string' ? JSON.parse(row.config) : (row.config || {});
            const shop = config.shop || row.shopify_shop;
            const version = config.apiVersion || row.shopify_api_version || '2025-07';
            const fromConfig = config.accessToken || config.apiKey || config.access_token || '';
            const token = fromConfig || row.shopify_token || '';
            const altToken = (row.shopify_token && row.shopify_token !== token) ? row.shopify_token : '';
            const tokenSource = fromConfig ? (config.accessToken ? 'config.accessToken' : config.apiKey ? 'config.apiKey' : 'config.access_token') : (row.shopify_token ? 'clients.shopify_token' : 'none');
            return { shop, configShop: config.shop || '', dbShop: row.shopify_shop || '', version, token, altToken, tokenSource, configKeys: Object.keys(config) };
          }

          async function fetchWordPressConnection(pool, slug) {
            const { rows } = await pool.query(`select cc.endpoint_url, cc.config from clients c join cms_connections cc on cc.client_id = c.id where c.slug = $1 and cc.provider = 'wordpress' and cc.is_active = true order by cc.updated_at desc nulls last limit 1`, [slug]);
            if (!rows.length) return null;
            const row = rows[0];
            const config = typeof row.config === 'string' ? JSON.parse(row.config) : (row.config || {});
            const url = config.url || config.endpointUrl || config.endpoint_url || config.siteUrl || config.site_url || row.endpoint_url || '';
            const apiKey = config.apiKey || config.api_key || config.tdsGeoApiKey || config.kivo_api_key || config.wp_api_key || config.accessToken || config.access_token || '';
            return { url, apiKey, configKeys: Object.keys(config) };
          }

          async function listShopifyArticles(shop, version, token, blogId) {
            const all = [];
            let pathname = `/blogs/${blogId}/articles.json?limit=250&fields=id,title,published_at`;
            for (let i = 0; i < 10; i++) {
              const res = await request({ url: `https://${shop}/admin/api/${version}${pathname}`, method: 'GET', headers: { 'X-Shopify-Access-Token': token, 'Content-Type': 'application/json' } });
              all.push(...(res.json.articles || []));
              const link = res.headers.link || '';
              const m = link.match(/<([^>]+)>;\s*rel="next"/);
              if (!m) break;
              const nextUrl = new URL(m[1]);
              pathname = nextUrl.pathname + nextUrl.search;
            }
            return all;
          }

          async function main() {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            const results = [];
            const connCache = {};
            const connTested = {};
            let uploaded = 0;
            try {
              for (const item of MANIFEST) {
                try {
                  const rel = item.file;
                  const filePath = path.join(draftsDir, rel);
                  const slug = path.basename(rel).replace(/\.md$/, '');
                  const md = fs.readFileSync(filePath, 'utf8');
                  const fm = parseFrontmatter(md);
                  const body = stripInternalSections(stripFrontmatter(md));
                  const html = mdToHtml(body);
                  const markers = findMarkers(html);
                  if (markers.length) {
                    results.push({ client: item.client, provider: item.provider, file: slug, action: 'skipped', guard: markers });
                    console.log(`article_${slug}_guard_hit:${markers.join(',')}`);
                    continue;
                  }
                  const summary = truncate(text(html), 200);
                  const tags = buildTags(fm.primary_keyword);
                  const payload = {
                    title: fm.title,
                    body_html: html,
                    summary_html: summary,
                    author: 'Traffic Digital Solutions',
                    tags: tags.join(', '),
                    published: false,
                    published_at: null,
                    metafields_global_title_tag: truncate(fm.seo_title || fm.title, 70),
                    metafields_global_description_tag: truncate(fm.meta_description || '', 160),
                  };

                  if (item.provider === 'shopify') {
                    const key = `shopify:${item.client}`;
                    if (!connCache[key]) {
                      connCache[key] = await fetchShopifyConnection(pool, item.client);
                      if (connCache[key]) {
                        const c = connCache[key];
                        console.log(`conn_diag_${item.client}: ${JSON.stringify({ shop: c.shop, config_shop: c.configShop, db_shop: c.dbShop, version: c.version, token_present: Boolean(c.token), token_len: c.token ? c.token.length : 0, token_source: c.tokenSource, alt_token_present: Boolean(c.altToken), config_keys: c.configKeys })}`);
                      }
                    }
                    const conn = connCache[key];
                    if (!conn || !conn.shop || !conn.token) {
                      results.push({ client: item.client, provider: 'shopify', file: slug, action: 'skipped', reason: 'no_active_shopify_connection' });
                      console.log(`article_${slug}_shopify_credentials_missing`);
                      continue;
                    }
                    if (!connTested[key]) {
                      const candidates = [conn.version, '2026-04', '2025-10', '2025-04', '2024-10', '2024-01', 'stable'];
                      const tokenCandidates = [{ token: conn.token, source: conn.tokenSource }];
                      if (conn.altToken) tokenCandidates.push({ token: conn.altToken, source: 'clients.shopify_token' });
                      let found = false;
                      let lastError = '';
                      for (const tc of tokenCandidates) {
                        for (const v of candidates) {
                          try {
                            await request({ url: `https://${conn.shop}/admin/api/${v}/shop.json`, method: 'GET', headers: { 'X-Shopify-Access-Token': tc.token, 'Content-Type': 'application/json' } });
                            conn.version = v;
                            conn.token = tc.token;
                            conn.tokenSource = tc.source;
                            found = true;
                            break;
                          } catch (e) { lastError = e.message; }
                        }
                        if (found) break;
                      }
                      if (found) {
                        connTested[key] = 'ok';
                        console.log(`shopify_conn_test_${item.client}: ok (version:${conn.version}, source:${conn.tokenSource})`);
                      } else {
                        connTested[key] = 'fail';
                        console.log(`shopify_conn_test_${item.client}: fail:${lastError}`);
                      }
                    }
                    if (connTested[key] !== 'ok') {
                      results.push({ client: item.client, provider: 'shopify', file: slug, action: 'skipped', reason: 'shopify_connection_test_failed' });
                      continue;
                    }
                    const existing = await listShopifyArticles(conn.shop, conn.version, conn.token, item.blogId);
                    const match = existing.find(a => String(a.title).trim().toLowerCase() === String(payload.title).trim().toLowerCase() && !a.published_at);
                    let record;
                    if (match) {
                      const putRes = await request({ url: `https://${conn.shop}/admin/api/${conn.version}/blogs/${item.blogId}/articles/${match.id}.json`, method: 'PUT', headers: { 'X-Shopify-Access-Token': conn.token, 'Content-Type': 'application/json' }, body: JSON.stringify({ article: { ...payload, id: match.id } }) });
                      record = putRes.json.article;
                      record.action = 'update';
                    } else {
                      const postRes = await request({ url: `https://${conn.shop}/admin/api/${conn.version}/blogs/${item.blogId}/articles.json`, method: 'POST', headers: { 'X-Shopify-Access-Token': conn.token, 'Content-Type': 'application/json' }, body: JSON.stringify({ article: payload }) });
                      record = postRes.json.article;
                      record.action = 'create';
                    }
                    await sleep(500);
                    const verify = await request({ url: `https://${conn.shop}/admin/api/${conn.version}/blogs/${item.blogId}/articles/${record.id}.json`, method: 'GET', headers: { 'X-Shopify-Access-Token': conn.token, 'Content-Type': 'application/json' } });
                    if (verify.json.article.published_at) throw new Error(`article_${slug}_published_unexpectedly`);
                    results.push({ client: item.client, provider: 'shopify', file: slug, id: record.id, title: record.title, handle: record.handle, published_at: verify.json.article.published_at, action: record.action });
                    uploaded++;
                    await sleep(500);
                  } else if (item.provider === 'wordpress') {
                    const key = `wordpress:${item.client}`;
                    if (!connCache[key]) {
                      connCache[key] = await fetchWordPressConnection(pool, item.client);
                      if (connCache[key]) {
                        const c = connCache[key];
                        console.log(`conn_diag_${item.client}: ${JSON.stringify({ url: c.url, apiKey_present: Boolean(c.apiKey), apiKey_len: c.apiKey ? c.apiKey.length : 0, config_keys: c.configKeys })}`);
                      }
                    }
                    const conn = connCache[key];
                    if (!conn || !conn.url || !conn.apiKey) {
                      results.push({ client: item.client, provider: 'wordpress', file: slug, action: 'skipped', reason: 'credentials_missing' });
                      console.log('boston_pharma_wordpress_credentials_missing');
                      continue;
                    }
                    if (!connTested[key]) {
                      try {
                        await request({ url: `${conn.url.replace(/\/+$/, '')}/wp-json/kivo/v1/status`, method: 'GET', headers: { 'X-Kivo-Key': conn.apiKey, 'Content-Type': 'application/json' } });
                        connTested[key] = 'ok';
                        console.log(`wordpress_conn_test_${item.client}: ok`);
                      } catch (e) {
                        connTested[key] = 'fail';
                        console.log(`wordpress_conn_test_${item.client}: fail:${e.message}`);
                      }
                    }
                    if (connTested[key] !== 'ok') {
                      results.push({ client: item.client, provider: 'wordpress', file: slug, action: 'skipped', reason: 'wordpress_connection_test_failed' });
                      continue;
                    }
                    const endpoint = `${conn.url.replace(/\/+$/, '')}/wp-json/kivo/v1/posts`;
                    const postRes = await request({ url: endpoint, method: 'POST', headers: { 'X-Kivo-Key': conn.apiKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ title: payload.title, content_html: html, status: 'draft', tags, meta_title: payload.metafields_global_title_tag, meta_description: payload.metafields_global_description_tag, author_email: 'Traffic Digital Solutions' }) });
                    const data = postRes.json && postRes.json.data ? postRes.json.data : postRes.json;
                    const postId = data.post_id || data.id;
                    await sleep(500);
                    const verify = await request({ url: `${conn.url.replace(/\/+$/, '')}/wp-json/kivo/v1/posts/${postId}`, method: 'GET', headers: { 'X-Kivo-Key': conn.apiKey, 'Content-Type': 'application/json' } });
                    const vdata = verify.json && verify.json.data ? verify.json.data : verify.json;
                    if (vdata.status && vdata.status !== 'draft') throw new Error(`article_${slug}_wp_status_${vdata.status}`);
                    results.push({ client: item.client, provider: 'wordpress', file: slug, id: postId, title: vdata.title || payload.title, handle: vdata.slug || null, published_at: null, status: vdata.status || 'draft', action: 'create' });
                    uploaded++;
                    await sleep(500);
                  }
                } catch (e) {
                  console.log(`article_${path.basename(item.file).replace(/\.md$/, '')}_error:${e.message}`);
                  results.push({ client: item.client, provider: item.provider, file: path.basename(item.file).replace(/\.md$/, ''), action: 'failed', error: e.message });
                }
              }
              if (uploaded === 0) {
                console.error(JSON.stringify({ ok: false, error: 'no_articles_uploaded', results }, null, 2));
                process.exitCode = 1;
              } else {
                console.log(JSON.stringify({ ok: true, action: 'uploaded_monthly_drafts_hidden', count: uploaded, results }, null, 2));
              }
            } finally { await pool.end(); }
          }
          main().catch(error => { console.error(JSON.stringify({ ok: false, error: error.message })); process.exit(1); });
          NODE
          docker exec -i -e DRAFTS_DIR=/tmp/monthly-drafts-${GITHUB_RUN_ID} -w /app tds-geo-api-1 node < /tmp/upload-monthly-drafts.mjs