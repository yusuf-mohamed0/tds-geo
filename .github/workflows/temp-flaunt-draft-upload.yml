name: Temp Flaunt Draft Upload

on:
  workflow_dispatch:

jobs:
  upload-flaunt-draft:
    runs-on: [self-hosted, truenas, tdsgeo]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Flaunt article as hidden draft
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/flaunt-draft-upload.mjs <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const { Pool } = require('pg');

          const articlePath = 'doc/clients/flaunt-cosmetics-global/articles/eyeliner-stamp-beginner-guide-uae-egypt.md';
          const blogId = '116005503268';
          const clientSlug = 'flaunt-cosmetics-global';

          function parseFrontmatter(text) {
            if (!text.startsWith('---\n')) return [{}, text];
            const end = text.indexOf('\n---', 4);
            if (end === -1) return [{}, text];
            const raw = text.slice(4, end).trim();
            const body = text.slice(text.indexOf('\n', end + 4) + 1).trim();
            const meta = {};
            for (const line of raw.split('\n')) {
              const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
              if (!match) continue;
              let value = match[2].trim();
              if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
              meta[match[1]] = value;
            }
            return [meta, body];
          }

          function escapeHtml(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          }

          function inlineMd(value) {
            return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
          }

          function mdToHtml(md) {
            const out = [];
            let paragraph = [];
            let listOpen = false;
            const flushParagraph = () => {
              if (!paragraph.length) return;
              out.push(`<p>${inlineMd(paragraph.join(' '))}</p>`);
              paragraph = [];
            };
            const closeList = () => {
              if (!listOpen) return;
              out.push('</ul>');
              listOpen = false;
            };
            for (const rawLine of md.split('\n')) {
              const line = rawLine.trim();
              if (!line) { flushParagraph(); closeList(); continue; }
              const heading = line.match(/^(#{1,4})\s+(.+)$/);
              if (heading) { flushParagraph(); closeList(); const level = heading[1].length; out.push(`<h${level}>${inlineMd(heading[2])}</h${level}>`); continue; }
              const bullet = line.match(/^-\s+(.+)$/);
              if (bullet) { flushParagraph(); if (!listOpen) { out.push('<ul>'); listOpen = true; } out.push(`<li>${inlineMd(bullet[1])}</li>`); continue; }
              if (line === '---') { flushParagraph(); closeList(); out.push('<hr>'); continue; }
              paragraph.push(line);
            }
            flushParagraph();
            closeList();
            return out.join('\n');
          }

          function excerpt(body, max = 160) {
            const text = body.replace(/[#*_`>\[\]()]/g, '').replace(/\s+/g, ' ').trim();
            return text.length <= max ? text : `${text.slice(0, max - 1).trim()}...`;
          }

          function shopifyRequest(shop, version, token, method, path, payload) {
            return new Promise((resolve, reject) => {
              const body = payload ? JSON.stringify(payload) : null;
              const req = https.request(`https://${shop}/admin/api/${version}${path}`, {
                method,
                headers: {
                  'X-Shopify-Access-Token': token,
                  'Content-Type': 'application/json',
                  ...(body ? { 'Content-Length': Buffer.byteLength(body) } : {}),
                },
                timeout: 30000,
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  let json = null;
                  try { json = data ? JSON.parse(data) : null; } catch {}
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(json);
                  else reject(new Error(JSON.stringify({ status: res.statusCode, body: json || data.slice(0, 300) })));
                });
              });
              req.on('timeout', () => req.destroy(new Error('timeout')));
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }

          async function main() {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              const { rows } = await pool.query(
                `select c.shopify_shop, c.shopify_api_version, cc.config
                   from clients c
                   join cms_connections cc on cc.client_id = c.id
                  where c.slug = $1 and cc.provider = 'shopify' and cc.is_active = true
                  order by cc.updated_at desc nulls last limit 1`,
                [clientSlug]
              );
              if (!rows.length) throw new Error('no_active_flaunt_shopify_connection');
              const row = rows[0];
              const config = row.config || {};
              const shop = config.shop || row.shopify_shop;
              const version = config.apiVersion || row.shopify_api_version || '2025-07';
              const token = config.accessToken;
              if (!shop || !token) throw new Error('missing_shop_or_token');

              await shopifyRequest(shop, version, token, 'GET', '/shop.json');

              const text = fs.readFileSync(articlePath, 'utf8');
              const [meta, body] = parseFrontmatter(text);
              const title = meta.title || body.match(/^#\s+(.+)$/m)?.[1] || 'Eyeliner Stamp For Beginners: A Calm First Routine';
              const html = mdToHtml(body);
              const payload = {
                article: {
                  title,
                  body_html: html,
                  tags: ['TDS draft', 'flaunt-cosmetics-global', meta.primary_keyword || 'eyeliner stamp beginners'].filter(Boolean).join(', '),
                  author: 'Traffic Digital Solutions',
                  published: false,
                  published_at: null,
                  summary_html: excerpt(body, 200),
                  metafields_global_title_tag: (meta.meta_title || title).slice(0, 70),
                  metafields_global_description_tag: (meta.meta_description || excerpt(body)).slice(0, 160),
                }
              };

              const existing = await shopifyRequest(shop, version, token, 'GET', `/blogs/${blogId}/articles.json?limit=250&fields=id,title,published_at,handle`);
              const draft = (existing.articles || []).find(article => article.title === title && !article.published_at);
              const result = draft
                ? await shopifyRequest(shop, version, token, 'PUT', `/blogs/${blogId}/articles/${draft.id}.json`, { article: { id: draft.id, ...payload.article } })
                : await shopifyRequest(shop, version, token, 'POST', `/blogs/${blogId}/articles.json`, payload);
              const id = result.article.id;
              const verify = await shopifyRequest(shop, version, token, 'GET', `/blogs/${blogId}/articles/${id}.json`);
              if (verify.article.published_at) throw new Error('draft_verification_failed_published_at_present');
              console.log(JSON.stringify({ ok: true, action: draft ? 'updated_existing_draft' : 'created_draft', shop, blogId, articleId: String(id), handle: verify.article.handle, published_at: null }));
            } finally {
              await pool.end();
            }
          }

          main().catch(error => {
            console.error(JSON.stringify({ ok: false, error: error.message }));
            process.exit(1);
          });
          NODE
          docker exec -i -w /app tds-geo-api-1 node < /tmp/flaunt-draft-upload.mjs
