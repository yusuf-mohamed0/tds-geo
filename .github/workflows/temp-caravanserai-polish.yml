name: Temp Caravanserai Polish Hidden Drafts

on:
  workflow_dispatch:

jobs:
  polish-hidden-drafts:
    runs-on: [self-hosted, Linux, X64, truenas, tdsgeo]
    timeout-minutes: 15
    steps:
      - name: Polish TDS Caravanserai hidden drafts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/caravanserai-polish-hidden-drafts.mjs <<'NODE'
          const https = require('https');
          const { Pool } = require('pg');

          const clientSlug = 'caravanserai';
          const blogId = '78074216615';

          const articles = [
            {
              id: 565428748455,
              title: 'The Art of Egyptian Brass Coffee Table Tray Styling: Where Heritage Meets Modern Sophistication',
              metaTitle: 'Egyptian Brass Coffee Table Tray Styling: Heritage Meets Modern',
              metaDescription: 'Style brass coffee table trays with Egyptian craftsmanship and collage textures: warm, heritage-rich living room arrangements from Caravanserai.',
              tags: ['brass', 'coffee', 'egyptian', 'table', 'tray'],
              image: 'https://cdn.shopify.com/s/files/1/0557/5163/9207/articles/FYA2401RED_Caravanserai_Living_Room_Coffee_Taable_Fiber_Collage_Artistic_Round_Circle_Red-Photoroom.png?v=1785242165',
              alt: 'Tambour collage coffee table in deep red fiber, styled as a warm Caravanserai living room centerpiece',
              html: `
                <p><strong>A coffee table is the most used surface in a living room, which is exactly why it deserves the kind of attention we usually give a wall.</strong> For nearly three decades, Caravanserai has designed handcrafted Egyptian home accessories from Cairo, and one of the clearest lessons from our showrooms is this: a well-considered tray can turn a busy table into a composed one.</p>
                <p>Brass trays sit at the heart of that idea. They carry morning coffee, evening tea, a stack of books, or a lit candle, and they do it while linking the warmth of Egyptian craft to a contemporary room. Where design, heritage and craftsmanship intersect, the tray is one of the quietest, most generous objects you can own.</p>
                <h2>Why a Brass Tray Belongs on Your Coffee Table</h2>
                <p>A tray gives your table a boundary. Instead of many objects competing for attention, a single defined surface gathers them into one deliberate arrangement. The eye rests, the room reads as intentional, and everyday objects stop looking like clutter.</p>
                <p>This is the thinking behind the <a href="https://caravanserai-design.com/collections/brass-collection">Brass Collection</a>: hand-shaped, brushed and finished pieces in a warm 70/30 copper-to-zinc tone that Egyptian artisans have worked with for generations. When a brass tray sits on a coffee table, it carries not just objects but the quiet history of its making.</p>
                <h2>Start With the Tray's Purpose</h2>
                <p>Before styling, decide what the tray will actually hold. Some trays are daily, carrying coffee cups, coasters, the remote and a candle. Others are display-only, holding a sculptural object, a stack of art books, or dried botanicals. The purpose decides the size of the tray and the height of what goes inside it.</p>
                <p>For a round tray, choose a coffee table with a similarly generous shape. The Tambour coffee table, with its collage fiber top, gives a brass tray a textural counterpart rather than a competing one; the deep red collage surface and the golden brass read as two warm voices in the same room.</p>
                <h2>Build Height, Then Layer</h2>
                <p>Flat objects can make an arrangement feel static. Add a vertical element inside the tray to give the eye somewhere to travel. A candle holder, like the Sultana Candle Holder with its collage fiber body, brings height, warmth, and an evening ritual in one small piece.</p>
                <p>Then layer around it: a closed bowl for keys or remotes, a small sculpture, a stack of two or three books. Keep the scale honest. An object that belongs on a console table will look oversized or lost on a coffee table; a piece made for a tray will sit in proportion.</p>
                <h2>Choose Objects That Belong Together</h2>
                <p>The most common styling mistake is mixing objects that share no visual language. In a brass-based arrangement, keep the palette warm: golden brass, deep reds and blacks, natural wood, linen. If you love the contrast of the <a href="https://caravanserai-design.com/collections/collage-collection">Collage Collection</a>, let one collage piece be the focal point and let the brass tray and smaller objects support it.</p>
                <p>Caravanserai's founders, creative director and artist Amina Sabry and co-founder Hoda El Attar, built the brand on the belief that everyday details, the curve of a chair's arm, the weight of a wooden table, the way light settles across a carved surface, are what shape the way we live. A tray arrangement is the same principle on a smaller scale.</p>
                <h2>Give the Arrangement Room to Breathe</h2>
                <p>Edit before you finish. Remove the third object even if you love it. Leave a section of the tray empty so the pieces can be seen. If your table also holds a lamp or a vase outside the tray, keep at least a hand's width of clear table between them.</p>
                <p>Refresh the tray seasonally rather than weekly. Swapping one element, a summer bowl for a winter candle, a bright collage piece for a quieter one, keeps the table feeling alive without constant maintenance.</p>
                <h2>A Styling That Grows With You</h2>
                <p>The best coffee table arrangement is not the one that looks perfect in a photograph; it is the one that works while you live around it. A brass tray from Caravanserai ages beautifully, takes a soft patina, and remains useful for decades, a piece designed, as we like to say, to stay.</p>
                <p>Start with the <a href="https://caravanserai-design.com/collections/brass-collection">Brass Collection</a>, choose one collage accent from the <a href="https://caravanserai-design.com/collections/collage-collection">Collage Collection</a>, and let the tray do what it does best: hold your daily life in something handcrafted and warm.</p>
              `,
            },
            {
              id: 565428584615,
              title: 'The Beauty of Brass: Caring for Handcrafted Metal Home Pieces',
              metaTitle: 'Brass Home Care: Caring for Handcrafted Egyptian Metal Pieces',
              metaDescription: 'How to clean and care for handcrafted Egyptian brass home pieces, from table lamps to side tables, with gentle everyday routines.',
              tags: ['egyptian-craftsmanship', 'home-decor'],
              image: 'https://cdn.shopify.com/s/files/1/0557/5163/9207/articles/TBL2101_Caravanserai_Lighting_Table_Lamp_Brass_1.png?v=1785242169',
              alt: 'Contemplation brass table lamp with a warm golden hand-finished base on a bedside table',
              html: `
                <p><strong>Brass does not need to be polished into a mirror; it needs to be understood.</strong> For over twenty-five years, Caravanserai has brought handcrafted Egyptian metalwork into Cairo homes and beyond, and caring for these pieces is simpler than most people expect, if you treat the metal the way it was made.</p>
                <p>The brass in the <a href="https://caravanserai-design.com/collections/brass-collection">Brass Collection</a> is typically a 70/30 blend of copper and zinc, the warm golden tone Egyptian artisans have shaped by hand for generations. That alloy is the reason brass feels alive: it responds to light, to touch, and even to the air around it.</p>
                <h2>Understand the Metal You Own</h2>
                <p>Because brass is an alloy of copper and zinc, it is naturally antimicrobial and remarkably durable. It does not rust like iron, and it develops character instead of simply aging. The warm glow you fall for is not a coating that can flake off; it is the metal itself.</p>
                <p>This is why a brass table lamp, like the <a href="https://caravanserai-design.com/products/contemplation-brass-table-lamp">Contemplation Brass Table Lamp</a>, can live beside you for decades. Hand-shaped, brushed and finished, it carries the mark of the Egyptian artisans who made it, and that finish only deepens with use.</p>
                <h2>Make Dusting the Everyday Habit</h2>
                <p>Most brass never needs serious cleaning. A soft dry cloth once a week removes the fine dust that dulls any surface. Dust is the real enemy of a warm glow; it sits on top of the metal and scatters light before it reaches the shine beneath. Microfiber or a soft cotton cloth is all you need.</p>
                <p>Work in small circular motions and let your hand move along the piece's form, not against it. For carved or patterned pieces, a soft brush or a dry cotton bud reaches the detail without scratching it.</p>
                <h2>When to Wash, When to Wipe</h2>
                <p>If a piece has gathered oils or spills, gentle soap and warm water are enough. Use a drop of mild dish soap, rinse with clean water, and dry immediately with a soft cloth. Never let brass air-dry: water spots are one of the few marks that genuinely need attention.</p>
                <p>For heavier grime, a paste of mild dish soap and a little flour, or a very fine polish paste, can lift it. The golden rule is gentle. Egyptian brass is hand-finished, and hand-finished surfaces respond best to the least aggressive approach.</p>
                <h2>Patina Is Not a Problem</h2>
                <p>Brass slowly deepens in tone with years of use. In the Egyptian climate, where humidity and warm air are part of daily life, a slight darkening at edges and in carved detail is normal, and it is exactly what makes a handcrafted piece look lived with rather than store-bought.</p>
                <p>If you prefer a brighter look, polish only occasionally, and only with a brass-safe polish applied thinly. If you love the aged character, do nothing; simply keep the piece dusted. There is no wrong choice, only a choice about the story you want the metal to tell.</p>
                <h2>Protect Against Scratches and Heat</h2>
                <p>Place coasters under glasses and mats under hot cups. Brass tolerates heat well, but a sudden hot surface can affect a lacquer or a fine finish. Lift objects rather than sliding them, and keep heavier pieces off delicate carved details. These small habits keep the surface original for years.</p>
                <p>For lamps, always unplug and let the bulb cool before cleaning, and keep water far from sockets and wiring. A dry cloth on the base and shade, a soft brush along the carved column, and the piece stays as warm as the night you first switched it on.</p>
                <p>Small metal details deserve the same courtesy. The brass birds, candle holders and trays scattered through a room keep their glow when dusted regularly and touched only with dry hands, so the oils from everyday use never build into a film.</p>
                <h2>Care as a Daily Ritual</h2>
                <p>Caring for brass is not a chore once you understand the metal. It is the same philosophy Caravanserai was founded on in Cairo in 1996: that the way light settles across a carved surface, or the weight of a brass piece in your hand, shapes how a room, and a day, feels. Warmth cast in metal asks only for a dry cloth and a little patience.</p>
                <p>Explore hand-shaped lamps, candle holders and side tables in the <a href="https://caravanserai-design.com/collections/brass-collection">Brass Collection</a>, and let your pieces gather the patina only time can give them.</p>
              `,
            },
          ];

          function text(html) { return String(html || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim(); }
          function truncate(value, max) { const chars = Array.from(String(value || '').trim()); return chars.length <= max ? chars.join('') : chars.slice(0, max - 1).join('').trimEnd() + '…'; }
          function request(shop, version, token, method, path, payload) {
            return new Promise((resolve, reject) => {
              const body = payload ? JSON.stringify(payload) : null;
              const req = https.request(`https://${shop}/admin/api/${version}${path}`, { method, headers: { 'X-Shopify-Access-Token': token, 'Content-Type': 'application/json', ...(body ? { 'Content-Length': Buffer.byteLength(body) } : {}) }, timeout: 30000 }, res => {
                let data = ''; res.on('data', c => data += c); res.on('end', () => { let json = null; try { json = data ? JSON.parse(data) : null; } catch {} if (res.statusCode >= 200 && res.statusCode < 300) resolve(json); else reject(new Error(JSON.stringify({ status: res.statusCode, body: json || data.slice(0, 300) }))); });
              });
              req.on('timeout', () => req.destroy(new Error('timeout'))); req.on('error', reject); if (body) req.write(body); req.end();
            });
          }
          async function main() {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              const { rows } = await pool.query(`select c.shopify_shop, c.shopify_api_version, cc.config from clients c join cms_connections cc on cc.client_id = c.id where c.slug = $1 and cc.provider = 'shopify' and cc.is_active = true order by cc.updated_at desc nulls last limit 1`, [clientSlug]);
              if (!rows.length) throw new Error('no_active_caravanserai_shopify_connection');
              const row = rows[0]; const config = row.config || {}; const shop = config.shop || row.shopify_shop; const version = config.apiVersion || row.shopify_api_version || '2025-07'; const token = config.accessToken;
              await request(shop, version, token, 'GET', '/shop.json');
              const results = [];
              for (const a of articles) {
                const summary = truncate(text(a.html), 200);
                const payload = { article: { id: a.id, title: a.title, body_html: a.html, summary_html: summary, author: 'Traffic Digital Solutions', tags: a.tags.join(', '), published: false, published_at: null, metafields_global_title_tag: truncate(a.metaTitle, 70), metafields_global_description_tag: truncate(a.metaDescription, 160), image: { src: a.image, alt: a.alt } } };
                await request(shop, version, token, 'PUT', `/blogs/${blogId}/articles/${a.id}.json`, payload);
                const verify = await request(shop, version, token, 'GET', `/blogs/${blogId}/articles/${a.id}.json`);
                if (verify.article.published_at) throw new Error(`article_${a.id}_published_unexpectedly`);
                results.push({ id: a.id, title: verify.article.title, handle: verify.article.handle, published_at: verify.article.published_at, has_image: Boolean(verify.article.image), image_alt: verify.article.image?.alt || null });
              }
              console.log(JSON.stringify({ ok: true, action: 'polished_caravanserai_hidden_drafts', shop, blogId, count: results.length, results }, null, 2));
            } finally { await pool.end(); }
          }
          main().catch(error => { console.error(JSON.stringify({ ok: false, error: error.message })); process.exit(1); });
          NODE
          docker exec -i -w /app tds-geo-api-1 node < /tmp/caravanserai-polish-hidden-drafts.mjs