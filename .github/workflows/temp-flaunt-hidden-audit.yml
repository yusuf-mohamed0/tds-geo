name: Temp Flaunt Hidden Audit

on:
  workflow_dispatch:

jobs:
  audit-hidden-drafts:
    runs-on: [self-hosted, truenas, tdsgeo]
    timeout-minutes: 10
    steps:
      - name: Export Flaunt hidden Beauty Tips drafts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/flaunt-hidden-audit.mjs <<'NODE'
          const https = require('https');
          const { Pool } = require('pg');
          const clientSlug = 'flaunt-cosmetics-global';
          const blogId = '116005503268';
          function shopifyRequest(shop, version, token, path) {
            return new Promise((resolve, reject) => {
              const req = https.request(`https://${shop}/admin/api/${version}${path}`, {
                method: 'GET', headers: { 'X-Shopify-Access-Token': token, 'Content-Type': 'application/json' }, timeout: 30000,
              }, (res) => {
                let data = ''; res.on('data', c => data += c); res.on('end', () => {
                  let json = null; try { json = data ? JSON.parse(data) : null; } catch {}
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(json);
                  else reject(new Error(JSON.stringify({ status: res.statusCode, body: json || data.slice(0, 300) })));
                });
              });
              req.on('timeout', () => req.destroy(new Error('timeout'))); req.on('error', reject); req.end();
            });
          }
          function clean(html) { return String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
          async function main() {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              const { rows } = await pool.query(`select c.shopify_shop, c.shopify_api_version, cc.config from clients c join cms_connections cc on cc.client_id = c.id where c.slug = $1 and cc.provider = 'shopify' and cc.is_active = true order by cc.updated_at desc nulls last limit 1`, [clientSlug]);
              if (!rows.length) throw new Error('no_active_flaunt_shopify_connection');
              const row = rows[0]; const config = row.config || {}; const shop = config.shop || row.shopify_shop; const version = config.apiVersion || row.shopify_api_version || '2025-07'; const token = config.accessToken;
              const data = await shopifyRequest(shop, version, token, `/blogs/${blogId}/articles.json?limit=50&fields=id,title,handle,body_html,summary_html,published_at,tags,author,updated_at,image`);
              const hidden = (data.articles || []).filter(a => !a.published_at).map(a => ({ id: a.id, title: a.title, handle: a.handle, author: a.author, tags: a.tags, updated_at: a.updated_at, published_at: a.published_at, has_image: Boolean(a.image), image_src: a.image?.src || null, summary: clean(a.summary_html), body_excerpt: clean(a.body_html).slice(0, 700) }));
              console.log(JSON.stringify({ ok: true, shop, blogId, count: hidden.length, hidden }, null, 2));
            } finally { await pool.end(); }
          }
          main().catch(error => { console.error(JSON.stringify({ ok: false, error: error.message })); process.exit(1); });
          NODE
          docker exec -i -w /app tds-geo-api-1 node < /tmp/flaunt-hidden-audit.mjs
