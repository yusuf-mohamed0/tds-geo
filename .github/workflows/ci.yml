name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_seo_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_ENV: production

      - name: Lint
        run: npx eslint backend/ --ext .ts --max-warnings 0

      - name: Unit & service tests
        run: npx vitest run --reporter=dot
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_seo_automation
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AWS
        env:
          SSH_HOST: ${{ secrets.AWS_HOST }}
          SSH_USER: ${{ secrets.AWS_USER }}
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            --exclude '.git' --exclude '.env' --exclude 'node_modules' \
            --exclude '.claude' --exclude '.pytest_cache' \
            --exclude 'graphify-out' --exclude '.understand-anything' \
            --exclude 'frontend/node_modules' --exclude 'assets' \
            --exclude 'Fonts' --exclude 'Icons' --exclude 'Services Icons' \
            --exclude 'n8n' --exclude 'tools' --exclude 'scripts' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ $SSH_USER@$SSH_HOST:/home/$SSH_USER/tds-geo/

      - name: Restart PM2
        env:
          SSH_HOST: ${{ secrets.AWS_HOST }}
          SSH_USER: ${{ secrets.AWS_USER }}
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $SSH_USER@$SSH_HOST \
            "cd /home/$SSH_USER/tds-geo && \
             source /home/$SSH_USER/.nvm/nvm.sh 2>/dev/null; \
             npm install --production 2>&1 | tail -5 && \
             pm2 restart tds-geo-backend --update-env && \
             sleep 8 && \
             curl -s http://localhost:3000/health | python3 -c 'import sys,json; d=json.load(sys.stdin); print(f\"Deploy OK: {d[\"status\"]}\")'"
