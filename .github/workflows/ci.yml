name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_seo_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_seo_automation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_ENV: production

      - name: Lint
        run: npx eslint backend/ --ext .ts

      - name: Unit & service tests
        run: npx vitest run --reporter=dot
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_seo_automation
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: DB migration dry-run
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d ai_seo_automation -f backend/database/schema.sql -q
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: ai_seo_automation

      - name: Security audit
        run: |
          echo "=== npm audit (production dependencies) ==="
          npm audit --omit=dev --audit-level=high
          echo "=== Secrets scan ==="
          if npm view @anthropic-ai/cli-scan version >/dev/null 2>&1; then
            npx @anthropic-ai/cli-scan --path . --no-input 2>/dev/null
          else
            echo "cli-scan package unavailable; skipping external secrets scan"
          fi

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npx vitest run --reporter=dot
        working-directory: frontend

      - name: Build check
        run: npm run build
        env:
          NODE_ENV: production

      - name: Notify failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}
        run: |
          if [ -z "$SLACK_WEBHOOK_CI" ]; then
            echo "SLACK_WEBHOOK_CI is not configured; skipping notification."
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"text":"CI failed on ${{ github.repository }}@${{ github.sha }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$SLACK_WEBHOOK_CI" || echo "Slack notification failed; CI failure remains the source of truth."
