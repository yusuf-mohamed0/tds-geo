name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_seo_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_ENV: production

      - name: Lint
        run: npx eslint backend/ --ext .ts

      - name: Unit & service tests
        run: npx vitest run --reporter=dot
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_seo_automation
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: DB migration dry-run
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ai_seo_automation -f backend/database/schema.sql -q
          for f in backend/database/migration_*.sql; do
            echo "Applying migration: $(basename $f)"
            PGPASSWORD=postgres psql -h localhost -U postgres -d ai_seo_automation -f "$f" -q
          done
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: ai_seo_automation

      - name: Security audit
        run: |
          echo "=== npm audit (production dependencies) ==="
          npm audit --omit=dev --audit-level=high
          echo "=== Secrets scan ==="
          npx @anthropic-ai/cli-scan --path . --no-input 2>/dev/null

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npx vitest run --reporter=dot
        working-directory: frontend

      - name: Build check
        run: npm run build
        env:
          NODE_ENV: production

      - name: Notify failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_CI }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ CI failed on ${{ github.repository }}@${{ github.sha }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ CI Failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\nActor: ${{ github.actor }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
