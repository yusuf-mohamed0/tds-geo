name: Docker Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after build?"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check production secrets
        id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Production deploy skipped: DEPLOY_HOST, DEPLOY_USER, or DEPLOY_SSH_KEY is not configured."
          fi

      - name: Deploy via SSH
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/ai-seo' }}

            echo "=== Pre-deploy: tag current image ==="
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prev-production 2>/dev/null || true

            echo "=== Pre-deploy: backup database ==="
            BACKUP_FILE="/tmp/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
            docker compose exec -T postgres pg_dump -U postgres -d ai_seo_automation -F c -f "$BACKUP_FILE" 2>/dev/null && \
              echo "Backup saved: $BACKUP_FILE" || \
              echo "Warning: DB backup failed (non-fatal)"

            echo "=== Pull new images ==="
            docker compose pull api worker

            echo "=== Run database migrations ==="
            for f in backend/database/migration_*.sql; do
              if [ -f "$f" ]; then
                echo "  Applying: $(basename $f)"
                docker compose exec -T postgres psql -U postgres -d ai_seo_automation -c "BEGIN;" 2>/dev/null
                if cat "$f" | docker compose exec -T postgres psql -U postgres -d ai_seo_automation -q 2>/dev/null; then
                  docker compose exec -T postgres psql -U postgres -d ai_seo_automation -c "COMMIT;" 2>/dev/null
                  echo "  ✅ $(basename $f) applied"
                else
                  docker compose exec -T postgres psql -U postgres -d ai_seo_automation -c "ROLLBACK;" 2>/dev/null
                  echo "  ❌ $(basename $f) failed — rolled back"
                  exit 1
                fi
              fi
            done

            echo "=== Deploy new version ==="
            docker compose up -d --no-deps api worker nginx

            echo "=== Health check ==="
            HEALTHY=false
            for i in {1..30}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                HEALTHY=true
                echo "  ✅ API healthy (attempt $i)"
                break
              fi
              echo "  Waiting... attempt $i/30 (HTTP $STATUS)"
              sleep 2
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "  ❌ Health check failed — rolling back"
              docker compose up -d --no-deps api worker nginx
              echo "  Rollback issued. Previous version restarted."
              exit 1
            fi

            echo "=== Smoke tests ==="
            FAILED=0
            for endpoint in /health /api/clients /api/articles; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$endpoint" 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "  ✅ $endpoint (HTTP $CODE)"
              else
                echo "  ❌ $endpoint (HTTP $CODE)"
                FAILED=1
              fi
            done

            if [ "$FAILED" = "1" ]; then
              echo "  ❌ Smoke tests failed — rolling back"
              docker compose up -d --no-deps api worker nginx
              exit 1
            fi

            echo "=== Clean up ==="
            docker image prune -f

            echo ""
            echo "══════════════════════════════════════════════"
            echo "  ✅ Production deployment complete!"
            echo "══════════════════════════════════════════════"
