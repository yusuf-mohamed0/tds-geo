name: kivo

services:
  api:
    image: ${TDS_IMAGE}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs
      - ${ADS_REPORTING_ROOT:-$HOME/tds-ads-reporting-automation}:/root/tds-ads-reporting-automation
      - ${ADS_REPORTING_OUTPUT:-$HOME/tds-ads-reporting-automation/reports}:/app/data/ads-reports
    expose:
      - "3000"
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  worker:
    image: ${TDS_IMAGE}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: ["node", "dist/backend/workers/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs
    networks:
      - app
    healthcheck:
      disable: true

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ${POSTGRES_DATA:-./postgres}:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ${REDIS_DATA:-./redis}:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    volumes:
      - ${CLOUDFLARED_DIR:-./cloudflared}:/etc/cloudflared
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    profiles:
      - tunnel

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ENCRYPTION_KEY: ${FREELMAPI_ENCRYPTION_KEY:-}
    expose:
      - "3001"
    networks:
      - app
    profiles:
      - sidecars

  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    shm_size: 1g
    expose:
      - "11235"
    networks:
      - app
    profiles:
      - sidecars

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    restart: unless-stopped
    expose:
      - "8787"
    networks:
      - app
    profiles:
      - sidecars

  openseo:
    image: ghcr.io/every-app/open-seo:latest
    restart: unless-stopped
    environment:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      PORT: 3001
      AUTH_MODE: local_noauth
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY:-}
      VITE_SHOW_DEVTOOLS: "false"
    expose:
      - "3001"
    networks:
      - app
    profiles:
      - sidecars

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BACKUP_DIR: /backups
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "apk add --no-cache bash coreutils &&
             echo '0 3 * * * /usr/local/bin/backup-db.sh >> /backups/backup.log 2>&1' | crontab - &&
             crond -f -l 2"
    networks:
      - app

volumes:
  caddy-data:
  caddy-config:

networks:
  app:
    driver: bridge
