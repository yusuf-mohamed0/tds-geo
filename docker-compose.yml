version: "3.9"

services:
  # ─── API Server ────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai-seo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ai_seo_automation}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_FALLBACK_KEY=${OPENAI_FALLBACK_KEY:-}
      - HEADROOM_BASE_URL=${HEADROOM_BASE_URL:-}
      - SHOPIFY_DEFAULT_SHOP=${SHOPIFY_DEFAULT_SHOP}
      - SHOPIFY_DEFAULT_ACCESS_TOKEN=${SHOPIFY_DEFAULT_ACCESS_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai-seo-network

  # ─── BullMQ Worker ─────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai-seo-worker
    restart: unless-stopped
    command: ["node", "dist/backend/workers/index.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ai_seo_automation}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_FALLBACK_KEY=${OPENAI_FALLBACK_KEY:-}
      - HEADROOM_BASE_URL=${HEADROOM_BASE_URL:-}
      - SHOPIFY_DEFAULT_SHOP=${SHOPIFY_DEFAULT_SHOP}
      - SHOPIFY_DEFAULT_ACCESS_TOKEN=${SHOPIFY_DEFAULT_ACCESS_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai-seo-network

  # ─── FreeLLMAPI (Free LLM Proxy) ────────────
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: ai-seo-freellmapi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ENCRYPTION_KEY: ${FREELMAPI_ENCRYPTION_KEY:-}
    ports:
      - "${HOST_BIND:-127.0.0.1}:3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - ai-seo-network

  # ─── Headroom (Prompt Compression Proxy) ─────
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: ai-seo-headroom
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:8787:8787"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - ai-seo-network

  # ─── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-seo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-ai_seo_automation}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/database/migration_v2.sql:/docker-entrypoint-initdb.d/02-migration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ai_seo_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-seo-network

  # ─── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-seo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ai-seo-network

  # ─── Nginx Reverse Proxy ────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: ai-seo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - ai-seo-network

  # ─── Database Backups ────────────────────────
  db-backup:
    image: postgres:16-alpine
    container_name: ai-seo-db-backup
    restart: unless-stopped
    environment:
      - DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ai_seo_automation}
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
    volumes:
      - db-backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        chmod +x /usr/local/bin/backup-db.sh &&
        echo '0 3 * * * /usr/local/bin/backup-db.sh' | crontab - &&
        crond -f -l 2
      "
    networks:
      - ai-seo-network

volumes:
  postgres-data:
  redis-data:
  freellmapi-data:
  nginx-logs:
  db-backups:

networks:
  ai-seo-network:
    driver: bridge
